apiVersion: v1
kind: ConfigMap
metadata:
  name: ms-sql-config
data:
  ACCEPT_EULA: "Y"
  MSSQL_PID: "Developer"
  DB_SERVER: "sqlserver-service"
---
apiVersion: v1
kind: Secret
metadata:
  name: ms-sql-secret
type: Opaque
data:
  # SuperSecretPassword123! base64 encoded
  MSSQL_SA_PASSWORD: U3VwZXJTZWNyZXRQYXNzd29yZDEyMyE=
  DB_PASSWORD: U3VwZXJTZWNyZXRQYXNzd29yZDEyMyE=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      containers:
      - name: sqlserver
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
        - containerPort: 1433
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        envFrom:
        - configMapRef:
            name: ms-sql-config
        - secretRef:
            name: ms-sql-secret
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver-service
spec:
  ports:
  - port: 1433
    targetPort: 1433
  selector:
    app: sqlserver
---
# API Gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-api-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-api
  template:
    metadata:
      labels:
        app: stream-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: stream-api-cnt
        image: aksacr.azurecr.io/api:v4
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: DATABASE_URL
          value: Driver={ODBC Driver 18 for SQL Server};Server=tcp:ecommserveraks.database.windows.net,1433;Database=ecommdb;Uid=ecommadmin;Pwd=admin@123@;Encrypt=yes;TrustServerCertificate=yes;Connection Timeout=30;
---
apiVersion: v1
kind: Service
metadata:
  name: stream-api-svc
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: stream-api
---
